<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilih Sales - Honda Dealer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="navbar">
        <a href="/simulasi" class="btn-back">&larr; Kembali</a>
        <div class="logo">HONDA</div>
    </header>

    <main class="container">
        <section class="sales-section">
            <h2>Pilih Sales Representative</h2>
            <p class="subtitle">Silakan pilih sales kami untuk negosiasi OTR, diskon, dan promo kredit secara langsung.</p>

            <div class="sales-list">
                {% for s in sales %}
                <div class="sales-card">
                    <div class="sales-info">
                        <h4>{{ s.nama_sales }}</h4>
                        <p class="role">Official Honda Sales Executive</p>
                    </div>
                    <a href="https://wa.me/{{ s.nomor_wa }}?text=Halo%20{{ s.nama_sales }},%20saya%20tertarik%20ingin%20tanya%20promo%20dan%20negosiasi%20kredit%20mobil%20Honda." 
                       target="_blank" class="btn-wa-direct">
                        Chat WA
                    </a>
                </div>
                {% else %}
                <p>Belum ada data sales yang tersedia.</p>
                {% endfor %}
            </div>
        </section>
    </main>
</body>
</html>
